schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  tasks:
    - Each task that changes code starts with "Load superpowers:test-driven-development with the Skill tool" and ends with "Load superpowers:verification-before-completion with the Skill tool and run its check".
    - The last task group has one task "Load superpowers:requesting-code-review with the Skill tool, then reproduce and fix every Critical and Important finding".

operations:
  apply:
    guidance:
      - These skills are required, not advisory. Load each one with the Skill tool when its step comes, never from memory; every load shows in the transcript as "Launching skill".
      - For each task that changes code, load superpowers:test-driven-development before writing code. Write the failing test first and see it fail, then write the code.
      - On any test, lint, build or CI failure or unexpected behavior, load superpowers:systematic-debugging before changing anything, and prove the root cause first.
      - Before checking off any task, load superpowers:verification-before-completion and follow it. Run the task's check plus pnpm lint and pnpm test, and show the output.
      - After the last task, load superpowers:requesting-code-review before reporting the change as complete.
  archive:
    guidance:
      - This change implements one part of docs/plan-platform.md or docs/plan-agents.md. After archiving, check off that part's substeps in its plan file.
